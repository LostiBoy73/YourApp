<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rezept · KochFlow</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./static/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="./static/app.css">
</head>
<body>
  <main class="container">
    <nav class="app-nav" aria-label="Hauptnavigation">
      <a class="brand" href="./index.html" aria-label="KochFlow Startseite">
        <span class="brand-mark">KF</span>
        <strong>KochFlow</strong>
      </a>
      <div class="nav-links">
        <a href="./index.html" data-icon="⌂">Start</a>
        <a href="./rezepte.html" class="active" data-icon="▤">Rezepte</a>
        <a href="./neues_rezept.html" data-icon="+">Neu</a>
        <a href="./community.html" data-icon="○">Öffentlich</a>
        <a href="./einkaufsliste.html" data-icon="✓">Einkauf</a>
        <a href="./wochenplan.html" data-icon="□">Plan</a>
        <a href="./import.html" data-icon="↧">Import</a>
        <a href="./entdecken.html" data-icon="⌕">Entdecken</a>
      </div>
    </nav>

    <div class="user-bar">
      <span id="current-user"></span>
    </div>

    <header class="page-header recipe-detail-header">
      <div>
        <p class="pill">Rezept</p>
        <h1 id="detail-titel">Lade Rezept...</h1>
        <div id="detail-kategorie" class="recipe-badges"></div>
        <div id="detail-meta" class="recipe-meta"></div>
      </div>
      <div id="detail-action-bar" class="detail-action-bar" aria-label="Rezeptaktionen"></div>
    </header>

    <section id="standard-ansicht" class="detail-layout">
      <article class="detail-panel recipe-detail-main">
        <h2>Zutaten</h2>
        <label for="portionen-input">Portionen</label>
        <input id="portionen-input" type="number" min="1" step="1" value="1" oninput="portionenUmrechnen()">
        <ul id="detail-zutaten" class="ingredients-list"></ul>
      </article>

      <article class="detail-panel">
        <h2>Zubereitung</h2>
        <ol id="standard-schritte-liste" class="prep-steps"></ol>
      </article>
    </section>

    <section id="kochmodus-overlay" class="kochmodus-overlay" hidden>
      <button type="button" class="koch-cancel" onclick="beendeKochmodus()" aria-label="Kochmodus abbrechen">× Abbrechen</button>
      <div class="koch-inhalt">
        <div id="koch-schritt-text" class="riesen-text"></div>
      </div>
      <div class="koch-controls">
        <button type="button" id="btn-prev-step" class="riesen-button secondary" onclick="vorherigerSchritt()">Zurück</button>
        <span id="koch-fortschritt" class="fortschritt">1 / 1</span>
        <button type="button" id="btn-next-step" class="riesen-button primary-action" onclick="naechsterSchritt()">Weiter</button>
      </div>
    </section>
  </main>

  <script src="./static/script.js"></script>
</body>
</html>
