<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezept laden...</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .schritt-karte { background: var(--pico-card-background-color); border: 2px solid var(--pico-primary-background); border-radius: 15px; padding: 1.5rem; min-height: 250px; }
        .rezept-layout { display: grid; gap: 2rem; }
        @media (min-width: 768px) { .rezept-layout { grid-template-columns: 1fr 2fr; } }
        .schritt-slide { flex-direction: column; height: 100%; min-height: 200px; }
        .badge { display: inline-block; background: var(--pico-form-element-background-color); border: 1px solid var(--pico-muted-border-color); padding: 0.2rem 0.6rem; border-radius: 15px; font-size: 0.9rem; margin-right: 0.3rem; }
    </style>
</head>
<body>
    <main class="container" id="detail-container">
        <nav>
            <ul>
                <li><strong>👨‍🍳 Berufsschul-Koch-App</strong></li>
            </ul>
            <ul>
                <li><a href="./rezepte.html" class="outline">🔙 Zurück zur Übersicht</a></li>
            </ul>
        </nav>

        <h1 id="detail-titel" style="margin-bottom: 0;">Lade Rezept...</h1>
        <div id="detail-tags" style="margin-bottom: 2rem;"></div>

        <hr>

        <div class="rezept-layout">
            <div>
                <h3>Zutaten</h3>
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; background: var(--pico-form-element-background-color); padding: 0.5rem 1rem; border-radius: 10px; border: 1px solid var(--pico-muted-border-color);">
                    <strong style="margin: 0;">Portionen:</strong>
                    <input type="number" id="portionen-rechner" min="1" style="width: 80px; margin: 0; padding: 0.2rem;" onchange="portionenUmrechnen()">
                </div>

                <ul id="detail-zutaten"></ul>
                
                <button id="btn-einkaufsliste" onclick="addRezeptToEinkaufsliste()" class="secondary" style="width: 100%;">🛒 Zur Einkaufsliste hinzufügen</button>
            </div>

            <div>
                <h3>Zubereitung</h3>
                <div class="schritt-karte" id="detail-schritte"></div>

                <div style="display: flex; justify-content: space-between; margin-top: 1rem;">
                    <button id="btn-zurueck" onclick="vorherigerSchritt()" class="secondary outline" style="width: 48%;">⬅️ Zurück</button>
                    <button id="btn-weiter" onclick="naechsterSchritt()" class="primary" style="width: 48%;">Weiter ➡️</button>
                </div>
            </div>
        </div>

        <div style="margin-top: 3rem; text-align: center;">
            <button onclick="rezeptLoeschen()" class="secondary outline" style="color: #d9534f; border-color: #d9534f;">⚠️ Dieses Rezept löschen</button>
        </div>
    </main>

    <script src="./static/script.js"></script>
</body>
</html>
