<!DOCTYPE html>
<html lang="de">
<head>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/x-icon" href="./static/favicon.ico">
  <link rel="apple-touch-icon" href="./static/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="./static/app.css">
  <title>Anmelden · KochFlow</title>
</head>
<body>
  <main class="container">
<header class="app-nav">
  <a class="brand" href="./index.html" aria-label="Zur Startseite">
    <span class="brand-mark">KF</span>
    <span>KochFlow</span>
  </a>
  <div class="nav-links">
        <a href="./index.html" data-icon="⌂">Start</a>
        <a href="./rezepte.html" data-icon="▤">Rezepte</a>
        <a href="./neues_rezept.html" data-icon="+">Neu</a>
        <a href="./community.html" data-icon="○">Öffentlich</a>
        <a href="./einkaufsliste.html" data-icon="✓">Einkauf</a>
        <a href="./wochenplan.html" data-icon="□">Plan</a>
        <a href="./import.html" data-icon="↧">Import</a>
        <a href="./entdecken.html" data-icon="⌕">Entdecken</a>
  </div>
</header>
<div id="current-user" class="user-bar"></div>

<section class="auth-card">
  <span class="pill">Konto</span>
  <h1 style="margin-top:.6rem;">Anmelden</h1>
  <p style="color:var(--app-muted);">Private Rezepte sind an dein Konto gebunden. Öffentliche Rezepte kannst du auch ohne Konto ansehen.</p>
  <div class="auth-tabs">
    <button id="tab-login" type="button">Anmelden</button>
    <button id="tab-register" class="secondary" type="button">Registrieren</button>
  </div>
  <p id="auth-message" class="empty-note" hidden></p>
  <form id="form-login" class="auth-form">
    <label>Benutzername<input id="login-username" required autocomplete="username"></label>
    <label>Passwort<input id="login-password" type="password" required autocomplete="current-password"></label>
    <button type="submit">Anmelden</button>
  </form>
  <form id="form-register" class="auth-form" hidden>
    <label>Benutzername<input id="register-username" required autocomplete="username"></label>
    <label>Passwort<input id="register-password" type="password" required autocomplete="new-password" minlength="4"></label>
    <label>Passwort wiederholen<input id="register-password-repeat" type="password" required autocomplete="new-password" minlength="4"></label>
    <button type="submit">Konto erstellen</button>
  </form>
</section>

  </main>
  <script src="./static/script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
