<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="manifest" href="/manifest.json">

    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezept importieren</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong>👨‍🍳 Berufsschul-Koch-App</strong></li>
            </ul>
            <ul>
                <li><a href="./index.html" class="outline">🔙 Zurück zum Menü</a></li>
            </ul>
        </nav>

        <h2>Chefkoch-Rezept importieren</h2>
        <p style="color: var(--pico-muted-color);">Kopiere den Link eines Chefkoch-Rezepts und füge ihn hier ein. Wir versuchen, alle Daten (Zutaten, Anleitung, Zeiten) automatisch in unsere App zu übertragen.</p>
        
        <!-- Das Formular hat kein action/method mehr. script.js übernimmt! -->
        <form id="form-import-chefkoch" style="margin-top: 2rem;">
            <label for="url">Chefkoch URL (Link)</label>
            <input type="url" id="url" name="url" placeholder="https://www.chefkoch.de/rezepte/..." required>
            
            <button type="submit">📥 Rezept jetzt importieren</button>
        </form>

        <!-- Dynamische Fehleranzeige für das JavaScript -->
        <article id="import-message" style="display: none; background-color: #f8d7da; border: 1px solid #f5c6cb; border-radius: 5px; padding: 1rem; margin-top: 1rem;">
            <!-- Wird von JS befüllt -->
        </article>

    </main>

    <!-- Unser schlaues JavaScript laden -->
    <script src="./static/script.js"></script>
</body>
</html>
