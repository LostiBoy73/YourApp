<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neues Rezept</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong>👨‍🍳 Berufsschul-Koch-App</strong></li>
            </ul>
            <ul>
                <li><a href="/" class="outline">🔙 Zurück</a></li>
            </ul>
        </nav>

        <h2>Neues Rezept eintragen</h2>
        
        <form action="/speichern" method="POST">
            <label for="titel">Rezeptname</label>
            <input type="text" id="titel" name="titel" placeholder="z.B. Käsespätzle" required>

            <div class="grid">
                <div>
                    <label for="dauer">Dauer (in Min.)</label>
                    <input type="number" id="dauer" name="dauer" placeholder="z.B. 30" required>
                </div>
                <div>
                    <label for="kategorie">Kategorie</label>
                    <select id="kategorie" name="kategorie">
                        <option value="vorspeise">Vorspeise</option>
                        <option value="hauptgericht" selected>Hauptgericht</option>
                        <option value="dessert">Dessert</option>
                    </select>
                </div>
            </div>

            <label>Zutaten</label>
            <div id="zutaten-container">
                <div class="grid zutaten-zeile" style="margin-bottom: 0.5rem;">
                    <input type="number" name="zutaten_menge[]" placeholder="Menge (z.B. 250)" style="margin-bottom:0;">
                    <input type="text" name="zutaten_einheit[]" placeholder="Einheit (z.B. g, ml)" style="margin-bottom:0;">
                    <input type="text" name="zutaten_name[]" placeholder="Zutat (z.B. Mehl)" required style="margin-bottom:0;">
                </div>
            </div>

            <button type="button" class="secondary outline" onclick="addZutatZeile()">➕ Zutat hinzufügen</button>

            <script>
            function addZutatZeile() {
                const container = document.getElementById('zutaten-container');
                // Wir erstellen eine Kopie der ersten Zutaten-Zeile
                const neueZeile = container.firstElementChild.cloneNode(true);
                
                // Wir leeren die Eingabefelder in der neuen Zeile
                const inputs = neueZeile.getElementsByTagName('input');
                for (let input of inputs) {
                    input.value = '';
                }
                
                // Die neue Zeile unten anhängen
                container.appendChild(neueZeile);
            }
            </script>
            <label for="anleitung">Zubereitung</label>
            <textarea id="anleitung" name="anleitung" placeholder="Zuerst das Mehl..." rows="5" required></textarea>

            <button type="submit">Rezept speichern</button>
        </form>
    </main>
</body>
</html>
