<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neues Rezept</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong>👨‍🍳 Berufsschul-Koch-App</strong></li>
            </ul>
            <ul>
                {% if von_wo == 'menue' %}
                    <li><a href="/" class="outline">🔙 Zurück zum Menü</a></li>
                {% else %}
                    <li><a href="/rezepte" class="outline">🔙 Zurück zu Rezepten</a></li>
                {% endif %}
            </ul>
        </nav>

        <h2>Neues Rezept eintragen</h2>
        
        <form action="/speichern" method="POST">
            <label for="titel">Rezeptname</label>
            <input type="text" id="titel" name="titel" placeholder="z.B. Käsespätzle" required>

            <div class="grid">
                <div>
                    <label for="dauer">Dauer (in Min.)</label>
                    <input type="number" id="dauer" name="dauer" placeholder="z.B. 30" required>
                </div>
                <div>
                    <label for="kategorie">Kategorie</label>
                    <select id="kategorie" name="kategorie">
                        <option value="vorspeise">Vorspeise</option>
                        <option value="hauptgericht" selected>Hauptgericht</option>
                        <option value="dessert">Dessert</option>
                    </select>
                </div>
            </div>

            <label>Zutaten</label>
            <div id="zutaten-container">
                <div class="grid zutaten-zeile" style="margin-bottom: 0.5rem; align-items: center;">
                    <input type="number" name="zutaten_menge[]" placeholder="Menge" style="margin-bottom:0;">
                    <input type="text" name="zutaten_einheit[]" placeholder="Einheit" style="margin-bottom:0;">
                    <input type="text" name="zutaten_name[]" placeholder="Zutat" required style="margin-bottom:0;">
                    <a href="#" onclick="removeZeile(this); return false;" style="text-align: center; font-size: 1.5rem; text-decoration: none;" title="Zeile entfernen">🗑️</a>
                </div>
            </div>
            <button type="button" class="secondary outline" onclick="addZutatZeile()">➕ Zutat hinzufügen</button>

            <script>
            function addZutatZeile() {
                const container = document.getElementById('zutaten-container');
                // Wir erstellen eine Kopie der ersten Zutaten-Zeile
                const neueZeile = container.firstElementChild.cloneNode(true);
                
                // Wir leeren die Eingabefelder in der neuen Zeile
                const inputs = neueZeile.getElementsByTagName('input');
                for (let input of inputs) {
                    input.value = '';
                }
                
                // Die neue Zeile unten anhängen
                container.appendChild(neueZeile);
            }
            </script>
            <label>Zubereitung (Schritt für Schritt)</label>
            <div id="schritte-container">
                <div class="schritt-zeile" style="margin-bottom: 0.5rem; display: flex; gap: 10px; align-items: center;">
                    <textarea name="anleitung_schritt[]" placeholder="Schritt 1: Zwiebeln fein würfeln..." rows="2" required style="margin-bottom:0; flex-grow: 1;"></textarea>
                    <a href="#" onclick="removeZeile(this); return false;" style="font-size: 1.5rem; text-decoration: none;" title="Schritt entfernen">🗑️</a>
                </div>
            </div>
            <button type="button" class="secondary outline" onclick="addSchrittZeile()">➕ Schritt hinzufügen</button>
                    
            <script>
            // Das ist die neue Funktion für die Schritte
            function addSchrittZeile() {
                const container = document.getElementById('schritte-container');
                const neueZeile = container.firstElementChild.cloneNode(true);
                const textareas = neueZeile.getElementsByTagName('textarea');
                for (let textarea of textareas) {
                    textarea.value = '';
                }
                container.appendChild(neueZeile);
            }
            function removeZeile(element) {
                const zeile = element.parentElement;
                const container = zeile.parentElement;
                
                // Wichtig: Die allerletzte Zeile darf nicht gelöscht werden, sonst fehlt die Vorlage zum Kopieren für neue Zeilen!
                if (container.children.length > 1) {
                    zeile.remove();
                } else {
                    // Ist es die letzte Zeile, leeren wir stattdessen einfach nur die Texteingaben
                    const inputs = zeile.querySelectorAll('input, textarea');
                    inputs.forEach(input => input.value = '');
                }
            }
            </script>
            <textarea id="anleitung" name="anleitung" placeholder="Zuerst das Mehl..." rows="5" required></textarea>

            <button type="submit">Rezept speichern</button>
        </form>
    </main>
</body>
</html>
