<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Einkaufsliste · KochFlow</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./static/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="./static/app.css">
</head>
<body>
  <main class="container">
    <nav class="app-nav" aria-label="Hauptnavigation">
      <a class="brand" href="./index.html" aria-label="KochFlow Startseite">
        <span class="brand-mark">KF</span>
        <strong>KochFlow</strong>
      </a>
      <div class="nav-links">
        <a href="./index.html" data-icon="⌂">Start</a>
        <a href="./rezepte.html" data-icon="▤">Rezepte</a>
        <a href="./neues_rezept.html" data-icon="+">Neu</a>
        <a href="./community.html" data-icon="○">Öffentlich</a>
        <a href="./einkaufsliste.html" class="active" data-icon="✓">Einkauf</a>
        <a href="./wochenplan.html" data-icon="□">Plan</a>
        <a href="./import.html" data-icon="↧">Import</a>
        <a href="./entdecken.html" data-icon="⌕">Entdecken</a>
      </div>
    </nav>

    <div class="user-bar">
      <span id="current-user"></span>
    </div>

    <header class="page-header">
      <div>
        <p class="pill">Einkauf</p>
        <h1>Einkaufsliste</h1>
        <p>Zutaten aus deinen Rezepten werden zusammengefasst. Manuelle Einträge kannst du getrennt mit Menge und Zutat ergänzen.</p>
      </div>
    </header>

    <section class="shopping-shell">
      <section class="form-panel">
        <h2>Rezepte</h2>
        <ul id="einkauf-rezepte" class="shopping-list"></ul>

        <form id="form-einkauf-manuell" class="manual-shopping-form">
          <h2>Manuell</h2>
          <div class="manual-shopping-grid manual-shopping-grid-three">
            <input id="manuell-menge-input" name="menge" type="text" autocomplete="off" inputmode="decimal" placeholder="Menge, z. B. 500">
            <input id="manuell-einheit-input" name="einheit" type="text" autocomplete="off" placeholder="Einheit, z. B. g">
            <input id="manuell-name-input" name="name" type="text" autocomplete="off" placeholder="Item, z. B. Tomaten" required>
          </div>
          <button type="submit" class="primary-action">Hinzufügen</button>
        </form>

        <ul id="einkauf-manuell" class="shopping-list" hidden></ul>
      </section>

      <section class="detail-panel">
        <h2>Zutaten</h2>
        <ul id="einkauf-zutaten" class="shopping-list"></ul>
      </section>
    </section>
  </main>

  <script src="./static/script.js"></script>
</body>
</html>
