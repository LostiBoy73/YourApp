<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./static/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="./static/app.css">
    <title>Meine Rezepte</title>
</head>
<body>
    <main class="container">
        <header class="app-nav">
            <a class="brand" href="./index.html" aria-label="Zur Startseite">
                <span class="brand-mark">YA</span>
                <span>YourApp Rezepte</span>
            </a>
            <div class="nav-links"><a class="" href="./index.html">Start</a><a class="active" href="./rezepte.html">Meine Rezepte</a><a class="" href="./community.html">Öffentlich</a><a class="" href="./neues_rezept.html">Neu</a><a class="" href="./einkaufsliste.html">Einkauf</a><a class="" href="./import.html">Import</a><a class="" href="./entdecken.html">Entdecken</a></div>
        </header>

        <div id="current-user" class="user-bar"></div>

        <section class="page-header">
            <div>
                <span class="pill">Privater Bereich</span>
                <h1>Meine Rezepte</h1>
                <p>Hier erscheinen nur Rezepte des aktuell gewählten Anzeigenamens.</p>
            </div>
            <a href="./neues_rezept.html" role="button">Neues Rezept</a>
        </section>

        <section class="panel filter-panel">
            <form method="get" action="./rezepte.html">
                <div class="filter-grid">
                    <input id="suche-input" name="suche" type="search" placeholder="Rezeptname, Zutat oder Kategorie suchen">
                    <select id="kategorie-select" name="kategorie">
                        <option value="">Alle Kategorien</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button type="submit">Suchen & filtern</button>
                    <a href="./rezepte.html" role="button" class="secondary">Zurücksetzen</a>
                </div>
            </form>
        </section>

        <section id="recipe-list-container" class="recipe-list" aria-live="polite">
            <p class="empty-note">Lade deine Rezepte...</p>
        </section>
    </main>
    <script src="./static/script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
