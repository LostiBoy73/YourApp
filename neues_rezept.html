<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neues Rezept</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong>👨‍🍳 Berufsschul-Koch-App</strong></li>
            </ul>
            <ul>
                <li><a href="index.html" class="outline">🔙 Zurück</a></li>
            </ul>
        </nav>

        <h2>Neues Rezept eintragen</h2>
        
        <form>
            <label for="titel">Rezeptname</label>
            <input type="text" id="titel" name="titel" placeholder="z.B. Käsespätzle" required>

            <div class="grid">
                <div>
                    <label for="dauer">Dauer (in Min.)</label>
                    <input type="number" id="dauer" name="dauer" placeholder="z.B. 30">
                </div>
                <div>
                    <label for="kategorie">Kategorie</label>
                    <select id="kategorie" name="kategorie">
                        <option value="vorspeise">Vorspeise</option>
                        <option value="hauptgericht">Hauptgericht</option>
                        <option value="dessert">Dessert</option>
                    </select>
                </div>
            </div>

            <label for="zutaten">Zutaten</label>
            <textarea id="zutaten" name="zutaten" placeholder="100g Mehl..." rows="3"></textarea>

            <label for="anleitung">Zubereitung</label>
            <textarea id="anleitung" name="anleitung" placeholder="Zuerst das Mehl mit den Eiern..." rows="5"></textarea>

            <button type="button" onclick="alert('Später wird das ans Backend gesendet!')">Rezept speichern</button>
        </form>
    </main>
</body>
</html>
