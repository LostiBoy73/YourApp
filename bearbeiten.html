<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="manifest" href="/manifest.json">

    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezept bearbeiten</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong>👨‍🍳 Berufsschul-Koch-App</strong></li>
            </ul>
            <div id="current-user"></div>
            <ul>
                <li><a href="./rezepte.html" class="outline">🔙 Zurück</a></li>
            </ul>
        </nav>

        <h2>Rezept bearbeiten</h2>
        
        <form id="form-bearbeiten">

            <div class="grid">
                <div style="flex-grow: 3;">
                    <label for="titel">Rezeptname</label>
                    <input type="text" id="titel" name="titel" required>
                </div>
                <div>
                    <label for="portionen">Portionen</label>
                    <input type="number" id="portionen" name="portionen" min="1" required>
                </div>
            </div>

            <div>
                <label>Kategorien (Tags)</label>
                <div id="kategorie-container">
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <input type="text" name="kategorie[]" placeholder="z.B. Vegetarisch" style="margin-bottom: 0;">
                        <button type="button" class="outline" onclick="removeZeile(this)" style="margin-bottom: 0; padding: 0 15px;" title="Zeile löschen">🗑️</button>
                    </div>
                </div>
                <button type="button" class="secondary outline" onclick="addKategorieZeile()" style="margin-top: 10px; margin-bottom: 2rem;">+ Kategorie hinzufügen</button>
            </div>

            <hr>

            <h3 style="margin-top: 2rem;">Zutaten</h3>
            <div id="zutaten-container">
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="text" name="zutaten_menge[]" placeholder="Menge" style="width: 80px; margin-bottom: 0;">
                    <input type="text" name="zutaten_einheit[]" placeholder="Einheit" style="width: 100px; margin-bottom: 0;">
                    <input type="text" name="zutaten_name[]" placeholder="Zutat" required style="flex-grow: 1; margin-bottom: 0;">
                    <button type="button" class="outline" onclick="removeZeile(this)" style="margin-bottom: 0; padding: 0 15px;" title="Zeile löschen">🗑️</button>
                </div>
            </div>
            <button type="button" class="secondary outline" onclick="addZutatZeile()" style="margin-top: 10px; margin-bottom: 2rem;">+ Zutat hinzufügen</button>

            <hr>

            <h3 style="margin-top: 2rem;">Schritt-für-Schritt Anleitung</h3>
            <div id="schritte-container">
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="number" name="anleitung_dauer[]" placeholder="Min." style="width: 80px; margin-bottom: 0;">
                    <textarea name="anleitung_schritt[]" placeholder="Was ist zu tun?" required style="flex-grow: 1; margin-bottom: 0; min-height: 50px;"></textarea>
                    <button type="button" class="outline" onclick="removeZeile(this)" style="margin-bottom: 0; padding: 0 15px;" title="Zeile löschen">🗑️</button>
                </div>
            </div>
            <button type="button" class="secondary outline" onclick="addSchrittZeile()" style="margin-top: 10px; margin-bottom: 2rem;">+ Schritt hinzufügen</button>

            <hr style="margin-top: 2rem; margin-bottom: 2rem;">
            
            <button type="submit">Änderungen speichern</button>
        </form>

        <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--pico-muted-border-color);">
            <button type="button" onclick="rezeptLoeschen()" class="secondary outline" style="color: #d9534f; border-color: #d9534f;">⚠️ Gesamtes Rezept löschen</button>
        </div>

    </main>

    <script src="./static/script.js"></script>

    <script>
        // Diese Zeilen fangen ab, falls ein Rezept gar keine Zutaten in der DB hatte
        const orgAddKat = addKategorieZeile;
        addKategorieZeile = function() {
            if(document.getElementById('kategorie-container').innerHTML === '') {
                document.getElementById('kategorie-container').innerHTML = `<div style="display: flex; gap: 10px; margin-bottom: 10px;"><input type="text" name="kategorie[]" placeholder="z.B. Vegetarisch" style="margin-bottom: 0;"><button type="button" class="outline" onclick="removeZeile(this)" style="margin-bottom: 0; padding: 0 15px;">🗑️</button></div>`;
            } else { orgAddKat(); }
        }
        const orgAddZut = addZutatZeile;
        addZutatZeile = function() {
            if(document.getElementById('zutaten-container').innerHTML === '') {
                document.getElementById('zutaten-container').innerHTML = `<div style="display: flex; gap: 10px; margin-bottom: 10px;"><input type="text" name="zutaten_menge[]" placeholder="Menge" style="width: 80px; margin-bottom: 0;"><input type="text" name="zutaten_einheit[]" placeholder="Einheit" style="width: 100px; margin-bottom: 0;"><input type="text" name="zutaten_name[]" placeholder="Zutat" required style="flex-grow: 1; margin-bottom: 0;"><button type="button" class="outline" onclick="removeZeile(this)" style="margin-bottom: 0; padding: 0 15px;">🗑️</button></div>`;
            } else { orgAddZut(); }
        }
        const orgAddSchritt = addSchrittZeile;
        addSchrittZeile = function() {
            if(document.getElementById('schritte-container').innerHTML === '') {
                document.getElementById('schritte-container').innerHTML = `<div style="display: flex; gap: 10px; margin-bottom: 10px;"><input type="number" name="anleitung_dauer[]" placeholder="Min." style="width: 80px; margin-bottom: 0;"><textarea name="anleitung_schritt[]" placeholder="Was ist zu tun?" required style="flex-grow: 1; margin-bottom: 0; min-height: 50px;"></textarea><button type="button" class="outline" onclick="removeZeile(this)" style="margin-bottom: 0; padding: 0 15px;">🗑️</button></div>`;
            } else { orgAddSchritt(); }
        }
    </script>
</body>
</html>
