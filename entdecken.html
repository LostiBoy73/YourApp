<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezepte entdecken</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        /* Spezielles Design für die API-Rezeptkarten */
        .api-card {
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .api-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid var(--pico-muted-border-color);
        }
        .api-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .api-content h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong>👨‍🍳 Berufsschul-Koch-App</strong></li>
            </ul>
            <ul>
                <li><a href="./index.html" class="outline">🏠 Menü</a></li>
            </ul>
        </nav>

        <h1 style="margin-bottom: 0.5rem;">🌍 Neue Rezepte entdecken</h1>
        <p style="color: var(--pico-muted-color); margin-bottom: 2rem;">
            Suche in einer riesigen Online-Datenbank nach neuen Ideen und importiere sie mit einem Klick in deine eigene Sammlung.
        </p>

        <!-- Formular lädt einfach die Seite mit ?suche=... neu, JS übernimmt dann -->
        <form action="./entdecken.html" method="GET" style="margin-bottom: 3rem;">
            <fieldset role="group">
                <input type="text" id="entdecken-suche-input" name="suche" placeholder="Zutat / Gericht auf Englisch (z.B. Chicken, Pasta, Cake...)" required>
                <button type="submit">🔍 Suchen</button>
            </fieldset>
        </form>

        <!-- Container für die API-Karten -->
        <div id="entdecken-container" class="grid" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;">
            <p style="text-align: center; width: 100%; grid-column: 1 / -1; color: var(--pico-muted-color);">Lade Rezepte...</p>
        </div>
    </main>

    <!-- Unser schlaues JavaScript laden -->
    <script src="./static/script.js"></script>
</body>
</html>
